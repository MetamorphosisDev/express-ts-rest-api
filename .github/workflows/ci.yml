name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: |
          npm install
          npm install --no-save @neondatabase/serverless@^1.1.0 dotenv@^17.4.2 drizzle-kit@^0.31.10 drizzle-orm@^0.45.2 typescript@5.9.3

      - name: Typecheck
        run: npx tsc --noEmit --rootDir .
